<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MigrationLens | Decision Resolution</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#1A2B4B",
              "secondary": "#006c49",
              "surface": "#F7F9FB",
              "outline": "#E0E3E5",
              "on-surface": "#191C1E",
              "on-surface-variant": "#44474E"
            },
            fontFamily: {
              "headline": ["Manrope", "sans-serif"],
              "body": ["Manrope", "sans-serif"],
              "label": ["Manrope", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.125rem", 
              "lg": "0.25rem", 
              "xl": "0.5rem", 
              "full": "0.75rem",
              "card": "0.125rem" // ROUND_FOUR roundness often implies smaller, more professional radii in enterprise systems
            },
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        background-color: #F7F9FB;
        font-family: 'Manrope', sans-serif;
      }
      /* Custom focus styles for the "Linear meets Notion" look */
      .focus-ring:focus-within {
        border-color: #1A2B4B;
        box-shadow: 0 0 0 1px #1A2B4B;
      }
    </style>
</head>
<body class="font-body text-on-surface antialiased">
<!-- Header Navigation (TopAppBar) -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-outline/50">
<div class="flex items-center justify-between px-8 py-4 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-2">
<span class="text-lg font-bold font-headline tracking-tight text-primary">MigrationLens</span>
</div>
<div class="flex items-center gap-6">
<div class="flex flex-col items-end gap-1">
<span class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Progress</span>
<div class="flex items-center gap-3">
<span class="text-xs font-semibold text-on-surface/70">Question 3 of 5</span>
<div class="w-32 h-1.5 bg-outline rounded-full overflow-hidden">
<div class="w-[60%] h-full bg-secondary"></div>
</div>
</div>
</div>
</div>
</div>
</header>
<main class="min-h-screen flex items-center justify-center px-6 pt-24 pb-12">
<div class="w-full max-w-3xl flex flex-col items-center text-center">
<!-- Context Badge -->
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-md bg-white border border-outline text-primary mb-10 shadow-sm transition-all hover:border-primary/30 cursor-default">
<span class="material-symbols-outlined text-[18px]" data-icon="psychology">psychology</span>
<span class="text-[11px] font-bold tracking-wide font-label uppercase">Asking as architect</span>
</div>
<!-- Question Counter -->
<span class="text-[11px] font-bold tracking-[0.2em] text-on-surface-variant/60 uppercase mb-4">
                Step 03
            </span>
<!-- Main Question -->
<h1 class="text-3xl md:text-4xl font-extrabold font-headline leading-tight text-primary mb-8 tracking-tight max-w-2xl">
                Who looks at this daily — just you, or does a team need it?
            </h1>
<!-- Contextual Tags -->
<div class="flex flex-wrap justify-center gap-2 mb-12">
<span class="px-2.5 py-1 rounded bg-white border border-outline text-[11px] font-semibold text-on-surface-variant shadow-sm">B2B SaaS</span>
<span class="px-2.5 py-1 rounded bg-white border border-outline text-[11px] font-semibold text-on-surface-variant shadow-sm">50 customers</span>
<span class="px-2.5 py-1 rounded bg-white border border-outline text-[11px] font-semibold text-on-surface-variant shadow-sm">Legacy Oracle</span>
</div>
<!-- Answer Selection (Bento-style Chips) -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full mb-8">
<button class="group flex flex-col items-center justify-center p-8 rounded-lg bg-white border border-outline hover:border-primary hover:shadow-md transition-all duration-200 active:scale-[0.98]">
<span class="material-symbols-outlined text-2xl mb-4 text-on-surface-variant group-hover:text-primary transition-colors" data-icon="person">person</span>
<span class="text-sm font-bold text-on-surface group-hover:text-primary transition-colors">Just me</span>
</button>
<button class="group flex flex-col items-center justify-center p-8 rounded-lg bg-white border border-outline hover:border-primary hover:shadow-md transition-all duration-200 active:scale-[0.98]">
<span class="material-symbols-outlined text-2xl mb-4 text-on-surface-variant group-hover:text-primary transition-colors" data-icon="groups">groups</span>
<span class="text-sm font-bold text-on-surface group-hover:text-primary transition-colors">Engineering team</span>
</button>
<button class="group flex flex-col items-center justify-center p-8 rounded-lg bg-white border border-outline hover:border-primary hover:shadow-md transition-all duration-200 active:scale-[0.98]">
<span class="material-symbols-outlined text-2xl mb-4 text-on-surface-variant group-hover:text-primary transition-colors" data-icon="corporate_fare">corporate_fare</span>
<span class="text-sm font-bold text-on-surface group-hover:text-primary transition-colors">Whole company</span>
</button>
</div>
<!-- Custom Input & Primary Action -->
<div class="flex items-center gap-4 w-full bg-white p-2 pl-6 rounded-lg border border-outline shadow-sm focus-within:border-primary/50 focus-within:ring-1 focus-within:ring-primary/10 transition-all">
<span class="material-symbols-outlined text-on-surface-variant/40" data-icon="edit_note">edit_note</span>
<input class="flex-1 bg-transparent border-none text-on-surface placeholder-on-surface-variant/40 focus:ring-0 py-3 font-body text-sm" placeholder="Or type your own answer..." type="text"/>
<button class="flex items-center gap-2 bg-primary hover:bg-[#253d6b] text-white px-8 py-3 rounded-md font-bold text-sm transition-all active:scale-[0.98] shadow-sm">
<span>Next</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Footer Lenses -->
<footer class="fixed bottom-0 w-full p-8">
<div class="max-w-7xl mx-auto flex justify-center gap-10">
<button class="flex items-center gap-2 group transition-opacity hover:opacity-100 opacity-30">
<span class="material-symbols-outlined text-lg text-primary" data-icon="visibility">visibility</span>
<span class="text-[10px] font-bold tracking-widest uppercase font-label text-primary">User lens</span>
</button>
<button class="flex items-center gap-2 group transition-opacity hover:opacity-100 opacity-100">
<div class="w-1.5 h-1.5 rounded-full bg-secondary group-hover:animate-pulse"></div>
<span class="text-[10px] font-bold tracking-widest uppercase font-label text-primary">Data lens</span>
</button>
<button class="flex items-center gap-2 group transition-opacity hover:opacity-100 opacity-30">
<span class="material-symbols-outlined text-lg text-primary" data-icon="architecture">architecture</span>
<span class="text-[10px] font-bold tracking-widest uppercase font-label text-primary">Architecture lens</span>
</button>
</div>
</footer>
<!-- Subtle Background Elements -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] bg-primary/[0.02] rounded-full blur-[80px]"></div>
<div class="absolute bottom-[10%] -right-[5%] w-[30%] h-[30%] bg-secondary/[0.03] rounded-full blur-[60px]"></div>
</div>
</body></html>
